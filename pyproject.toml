[project]
name = "ledgerflow"
version = "0.1.0"
description = "LedgerFlow payments and compliance services"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "fastapi[standard]>=0.141.1",
    "python-dotenv>=1.2.3",
    "pyjwt>=2.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "testes.py"]

[tool.fastapi]
entrypoint = "services.payments.app.main:app"

[tool.ruff.lint]
select = ["F", "E9"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "alembic>=1.15.0",
    "ruff>=0.16.7",
]
