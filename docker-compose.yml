services:
  app:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-before-any-real-deploy}

  # Local Postgres, kept for offline dev — not started automatically by `app`
  # anymore. Run `docker compose up db` and point DATABASE_URL at it in .env
  # if you want to work without a Supabase connection.
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerflow"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  db_data:
